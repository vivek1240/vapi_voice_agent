<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vapi Web Call Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .container {
            background: rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 { margin-bottom: 8px; }
        .subtitle { color: #aaa; margin-bottom: 30px; }
        #callBtn {
            width: 120px; height: 120px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #00d9ff, #0099ff);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.2s;
        }
        #callBtn:hover { transform: scale(1.05); }
        #callBtn.active { background: linear-gradient(135deg, #ff4757, #ff3838); }
        #callBtn.connecting { background: linear-gradient(135deg, #ffd700, #ff8c00); }
        #status {
            padding: 15px;
            border-radius: 10px;
            background: rgba(0,0,0,0.3);
            margin-bottom: 15px;
            min-height: 50px;
        }
        #log {
            text-align: left;
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 11px;
            max-height: 150px;
            overflow-y: auto;
        }
        .success { color: #00ff88; }
        .error { color: #ff6b6b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ Voice Assistant</h1>
        <p class="subtitle">Web Call Test</p>
        
        <button id="callBtn">
            📞<br>Start Call
        </button>
        
        <div id="status">Initializing...</div>
        <div id="log"></div>
    </div>

    <script type="module">
        // Import Vapi module and get default export
        import VapiModule from 'https://cdn.jsdelivr.net/npm/@vapi-ai/web@2.5.2/+esm';
        const Vapi = VapiModule.default || VapiModule;
        
        let vapi = null;
        let calling = false;
        let config = null;
        
        function log(msg, isError) {
            const el = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            el.innerHTML += `<div class="${isError ? 'error' : ''}">[${time}] ${msg}</div>`;
            el.scrollTop = el.scrollHeight;
            console.log(msg);
        }
        
        function status(msg, cls) {
            document.getElementById('status').innerHTML = `<span class="${cls || ''}">${msg}</span>`;
        }
        
        function setBtnState(state) {
            const btn = document.getElementById('callBtn');
            btn.className = state;
            if (state === 'active') {
                btn.innerHTML = '🔴<br>End Call';
                calling = true;
            } else if (state === 'connecting') {
                btn.innerHTML = '⏳<br>Connecting...';
            } else {
                btn.innerHTML = '📞<br>Start Call';
                calling = false;
            }
        }
        
        async function init() {
            log('Fetching config from backend...');
            
            try {
                const res = await fetch('/trigger_call/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: '{}'
                });
                config = await res.json();
                log('Config loaded: ' + config.transport.assistantId.substring(0,8) + '...');
            } catch(e) {
                log('Failed to fetch config: ' + e.message, true);
                status('Backend error - is server running?', 'error');
                return;
            }
            
            log('Initializing Vapi SDK...');
            
            try {
                vapi = new Vapi(config.transport.publicKey);
                log('Vapi instance created!');
                
                vapi.on('call-start', () => {
                    log('Event: call-start');
                    setBtnState('active');
                    status('🎤 Connected! Speak now...', 'success');
                });
                
                vapi.on('call-end', () => {
                    log('Event: call-end');
                    setBtnState('');
                    status('Call ended', 'success');
                });
                
                vapi.on('error', (e) => {
                    log('Event: error - ' + JSON.stringify(e), true);
                    setBtnState('');
                    status('Error occurred', 'error');
                });
                
                vapi.on('speech-start', () => log('Event: speech-start (assistant speaking)'));
                vapi.on('speech-end', () => log('Event: speech-end'));
                
                status('✅ Ready! Click Start Call', 'success');
                log('Vapi ready!');
                
            } catch(e) {
                log('Failed to create Vapi: ' + e.message, true);
                status('SDK init failed: ' + e.message, 'error');
            }
        }
        
        async function handleCall() {
            if (!vapi) {
                status('Not ready yet', 'error');
                return;
            }
            
            if (calling) {
                log('Stopping call...');
                vapi.stop();
                setBtnState('');
                status('Call stopped', 'success');
            } else {
                log('Starting call with assistant: ' + config.transport.assistantId);
                setBtnState('connecting');
                status('Connecting...', '');
                
                try {
                    await vapi.start(config.transport.assistantId);
                    log('vapi.start() completed');
                } catch(e) {
                    log('Start failed: ' + e.message, true);
                    setBtnState('');
                    status('Failed: ' + e.message, 'error');
                }
            }
        }
        
        // Attach click handler
        document.getElementById('callBtn').addEventListener('click', handleCall);
        
        // Start initialization
        init();
    </script>
</body>
</html>
